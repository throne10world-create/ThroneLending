<head>

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Трон Десяти Миров">
    <meta property="og:title" content="Опрос | Трон Десяти Миров">
    <meta property="og:description" content="Опрос сообщества Трон Десяти Миров">
    <meta property="og:url" content="https://throne10world-create.github.io/Throne/survey">
    <meta property="og:image" content="https://throne10world-create.github.io/Throne/icon.png">

    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:description" content="Опрос сообщества Трон Десяти Миров">
    <meta name="twitter:image" content="https://throne10world-create.github.io/Throne/icon.png">
    
    <!-- Фавиконки -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="shortcut icon" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- Цвет темы -->
    <meta name="theme-color" content="#242424" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#C6CDCF" media="(prefers-color-scheme: light)">
    
    <!-- Канонический URL -->
    <link rel="canonical" href="https://throne10world-create.github.io/Throne/survey">
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            scroll-behavior:smooth;
        }

        :root{
            --bg-light:#C6CDCF;
            --text-light:#242424;
            --card-light:rgba(36,36,36,0.08);
            --border-light:rgba(36,36,36,0.15);
            --accent-light:#6D777B;
            --accent2-light:#242424;
            --glass-bg-light:rgba(198,205,207,0.7);
            --shadow-light:rgba(36,36,36,0.1);
            
            --bg-dark:#242424;
            --text-dark:#C6CDCF;
            --card-dark:rgba(198,205,207,0.08);
            --border-dark:rgba(198,205,207,0.15);
            --accent-dark:#6D777B;
            --accent2-dark:#C6CDCF;
            --glass-bg-dark:rgba(36,36,36,0.7);
            --shadow-dark:rgba(0,0,0,0.3);
        }

        [data-theme="light"], :root {
            --bg:var(--bg-light);
            --text:var(--text-light);
            --card:var(--card-light);
            --border:var(--border-light);
            --accent:var(--accent-light);
            --accent2:var(--accent2-light);
            --glass-bg:var(--glass-bg-light);
            --shadow:var(--shadow-light);
        }

        [data-theme="dark"] {
            --bg:var(--bg-dark);
            --text:var(--text-dark);
            --card:var(--card-dark);
            --border:var(--border-dark);
            --accent:var(--accent-dark);
            --accent2:var(--accent2-dark);
            --glass-bg:var(--glass-bg-dark);
            --shadow:var(--shadow-dark);
        }

        body{
            font-family:'Inter',sans-serif;
            background:var(--bg);
            color:var(--text);
            overflow-x:hidden;
            transition: background 0.5s ease, color 0.5s ease;
            min-height: 100vh;
        }

        /* Шахматный фон */
        .chess-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            opacity: 0.03;
        }

        [data-theme="dark"] .chess-bg {
            opacity: 0.05;
        }

        .chess-piece {
            position: absolute;
            font-size: 60px;
            animation: floatChess 20s infinite linear;
            will-change: transform;
        }

        .chess-piece:nth-child(1) { top: 5%; left: 5%; animation-delay: 0s; animation-duration: 25s; }
        .chess-piece:nth-child(2) { top: 15%; left: 85%; animation-delay: -3s; animation-duration: 22s; }
        .chess-piece:nth-child(3) { top: 25%; left: 15%; animation-delay: -7s; animation-duration: 28s; }
        .chess-piece:nth-child(4) { top: 35%; left: 75%; animation-delay: -5s; animation-duration: 20s; }
        .chess-piece:nth-child(5) { top: 45%; left: 25%; animation-delay: -10s; animation-duration: 30s; }
        .chess-piece:nth-child(6) { top: 55%; left: 65%; animation-delay: -2s; animation-duration: 18s; }
        .chess-piece:nth-child(7) { top: 65%; left: 35%; animation-delay: -8s; animation-duration: 26s; }
        .chess-piece:nth-child(8) { top: 75%; left: 55%; animation-delay: -12s; animation-duration: 24s; }
        .chess-piece:nth-child(9) { top: 85%; left: 45%; animation-delay: -15s; animation-duration: 32s; }
        .chess-piece:nth-child(10) { top: 95%; left: 95%; animation-delay: -6s; animation-duration: 19s; }

        @keyframes floatChess {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            25% { transform: translate(50px, -30px) rotate(5deg) scale(1.1); }
            50% { transform: translate(30px, -50px) rotate(-3deg) scale(1); }
            75% { transform: translate(-20px, -20px) rotate(4deg) scale(0.9); }
            100% { transform: translate(0, 0) rotate(0deg) scale(1); }
        }

        /* Шахматная сетка */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(0deg, transparent 24%, var(--border) 25%, var(--border) 26%, transparent 27%, transparent 74%, var(--border) 75%, var(--border) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, var(--border) 25%, var(--border) 26%, transparent 27%, transparent 74%, var(--border) 75%, var(--border) 76%, transparent 77%, transparent);
            background-size: 100px 100px;
            opacity: 0.02;
            z-index: -1;
            pointer-events: none;
        }

        /* Header */
        .header{
            position:fixed;
            width:100%;
            top:0;
            z-index:1000;
            backdrop-filter:blur(14px);
            background:var(--glass-bg);
            border-bottom:1px solid var(--border);
            transition: all 0.3s ease;
        }

        .navbar{
            width:min(1400px,92%);
            margin:auto;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:18px 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
        }

        .logo-img {
            height: 40px;
            width: auto;
            transition: all 0.3s ease;
        }

        .logo-text {
            font-family:'Orbitron',sans-serif;
            font-weight:900;
            letter-spacing:2px;
            font-size: 1.2rem;
        }

        .desktop-theme-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card);
            backdrop-filter: blur(20px);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .desktop-theme-btn:hover {
            transform: scale(1.1);
            border-color: var(--accent);
            box-shadow: 0 5px 20px var(--shadow);
            background: var(--accent);
            color: white;
        }

        /* Основной контент */
        .main-content {
            min-height: 100vh;
            padding-top: 120px;
            width: min(1400px, 92%);
            margin: auto;
        }

        .survey-section {
            padding: 40px 0 80px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title span {
            color: var(--accent);
            letter-spacing: 4px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .section-title h1 {
            font-size: 3rem;
            margin-top: 15px;
            color: var(--text);
            font-family: 'Orbitron', sans-serif;
        }

        .section-title p {
            margin-top: 20px;
            opacity: 0.8;
            line-height: 1.8;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Контейнер для опроса */
        .survey-container {
            background: var(--card);
            border: 1px solid var(--border);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 30px;
            padding: 30px;
            overflow: hidden;
            box-shadow: 0 20px 50px var(--shadow);
        }

        .survey-container iframe {
            width: 100%;
            border: none;
            border-radius: 20px;
            display: block;
            min-height: 600px;
            background: transparent;
        }

        /* Навигация назад */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            text-decoration: none;
            margin-bottom: 30px;
            padding: 10px 20px;
            border-radius: 30px;
            background: var(--card);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: var(--accent);
            color: white;
            transform: translateX(-5px);
        }

        /* Футер */
        .footer {
            text-align: center;
            padding: 40px 20px;
            background: var(--card);
            border-top: 1px solid var(--border);
        }

        .footer p {
            opacity: 0.7;
            font-size: 0.9rem;
        }

        .footer-line {
            width: 150px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            margin: 20px auto;
        }

        /* Кнопка наверх */
        .scroll-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: var(--card);
            backdrop-filter: blur(20px);
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1.2rem;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
        }

        .scroll-to-top.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .scroll-to-top:hover {
            transform: translateY(-5px);
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 10px 30px var(--shadow);
        }

        /* Адаптивность */
        @media (max-width: 1100px) {
            .section-title h1 {
                font-size: 2rem;
            }
            
            .survey-container {
                padding: 20px;
                border-radius: 20px;
            }
        }

        @media (max-width: 700px) {
            .main-content {
                padding-top: 100px;
            }
            
            .section-title h1 {
                font-size: 1.8rem;
            }
            
            .survey-container {
                padding: 15px;
                border-radius: 15px;
            }
            
            .survey-container iframe {
                min-height: 400px;
            }
            
            .back-link {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

<!-- Шахматный фон -->
<div class="chess-bg">
    <div class="chess-piece">♔</div>
    <div class="chess-piece">♕</div>
    <div class="chess-piece">♖</div>
    <div class="chess-piece">♗</div>
    <div class="chess-piece">♘</div>
    <div class="chess-piece">♙</div>
    <div class="chess-piece">♚</div>
    <div class="chess-piece">♛</div>
    <div class="chess-piece">♜</div>
    <div class="chess-piece">♝</div>
</div>

<!-- Header -->
<header class="header">
    <nav class="navbar">
        <a href="index.html" class="logo">
            <img src="logoLighttheme.png" alt="Logo" class="logo-img" id="logoImg">
            <span class="logo-text">ТРОН X МИРОВ</span>
        </a>

        <button class="desktop-theme-btn" id="themeBtn" aria-label="Switch theme">
            <i class="fas fa-moon"></i>
        </button>
    </nav>
</header>

<!-- Основной контент -->
<main class="main-content">
    <div class="survey-section">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Вернуться на главную
        </a>
        
        <div class="section-title">
            <span>СООБЩЕСТВО</span>
            <h1>Опрос сообщества</h1>
            <p>
                Ваше мнение важно для развития проекта. Пожалуйста, уделите несколько минут, 
                чтобы помочь нам сделать игру лучше.
            </p>
        </div>

        <div class="survey-container">
            <iframe 
                src="https://docs.google.com/forms/d/e/1FAIpQLSeFKCD7MoFe3aRvNs2aMueHc4vScQ9LfmRSoEwiNG5b-rLQ0A/viewform?embedded=true" 
                height="2955" 
                frameborder="0" 
                marginheight="0" 
                marginwidth="0">
                Загрузка…
            </iframe>
        </div>
    </div>
</main>

<!-- Футер -->
<footer class="footer">
    <p>ТРОН ДЕСЯТИ МИРОВ</p>
    <div class="footer-line"></div>
    <p>© 2026 Throne Ten Worlds. Все права защищены.</p>
</footer>

<!-- Кнопка наверх -->
<button class="scroll-to-top" id="scrollToTop" aria-label="Наверх">
    <i class="fas fa-chevron-up"></i>
</button>

<script>
    // Переключение темы
    const html = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const logoImg = document.getElementById('logoImg');
    
    function setTheme(theme) {
        html.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
        
        if (logoImg) {
            logoImg.src = theme === 'dark' ? 'logoDarktheme.png' : 'logoLighttheme.png';
        }
        
        if (themeBtn) {
            const icon = theme === 'dark' ? 'fa-sun' : 'fa-moon';
            themeBtn.innerHTML = `<i class="fas ${icon}"></i>`;
        }
    }
    
    const savedTheme = localStorage.getItem('theme') || 'light';
    setTheme(savedTheme);
    
    if (themeBtn) {
        themeBtn.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        });
    }
    
    // Кнопка наверх
    const scrollToTopBtn = document.getElementById('scrollToTop');
    
    window.addEventListener('scroll', () => {
        if (window.scrollY > 500) {
            scrollToTopBtn.classList.add('visible');
        } else {
            scrollToTopBtn.classList.remove('visible');
        }
    });
    
    scrollToTopBtn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    
    // Автоматическая высота iframe
    window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'resize' && e.data.height) {
            const iframe = document.querySelector('.survey-container iframe');
            if (iframe) {
                iframe.style.height = e.data.height + 'px';
            }
        }
    });
</script>

</body>
</html>
